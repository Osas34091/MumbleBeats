name: Release MumbleBeats

on:
  release:
    types: [created]

# Permisos necesarios para subir assets a la release
permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  #  BUILD WEB UI (once, shared as artifact)
  # ─────────────────────────────────────────────
  build-web:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & build
        run: |
          cd web
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  #  WINDOWS (amd64)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    needs: build-web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: go build -v -ldflags "-H=windowsgui -s -w" -o mumblebeats-windows-amd64.exe ./cmd/bot

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mumblebeats-windows-amd64.exe

  # ─────────────────────────────────────────────
  #  LINUX (amd64)
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          go build -v -ldflags "-s -w" -o mumblebeats-linux-amd64 ./cmd/bot
          chmod +x mumblebeats-linux-amd64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mumblebeats-linux-amd64

  # ─────────────────────────────────────────────
  #  macOS ARM64 (Apple Silicon M1/M2/M3)
  # ─────────────────────────────────────────────
  build-macos-arm64:
    name: Build macOS (Apple Silicon)
    needs: build-web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          go build -v -ldflags "-s -w" -o mumblebeats-macos-arm64 ./cmd/bot
          chmod +x mumblebeats-macos-arm64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mumblebeats-macos-arm64

  # ─────────────────────────────────────────────
  #  macOS AMD64 (Intel)
  # ─────────────────────────────────────────────
  build-macos-amd64:
    name: Build macOS (Intel)
    needs: build-web
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Download Web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build
        run: |
          go build -v -ldflags "-s -w" -o mumblebeats-macos-amd64 ./cmd/bot
          chmod +x mumblebeats-macos-amd64

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: mumblebeats-macos-amd64
